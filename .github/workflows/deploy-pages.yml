name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: ${{ hashFiles('package.json') != '' }}
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: pnpm install --frozen-lockfile

      - name: Build project
        if: ${{ hashFiles('package.json') != '' }}
        run: pnpm build

      - name: Prepare static output for Pages
        run: |
          mkdir -p _site

          if [ -d dist ]; then
            cp -R dist/. _site/
          elif [ -d build ]; then
            cp -R build/. _site/
          else
            find . -maxdepth 1 -mindepth 1 \
              ! -name '.git' \
              ! -name '.github' \
              ! -name '.vscode' \
              ! -name '.DS_Store' \
              ! -name '.gitignore' \
              -exec cp -R {} _site/ \;
          fi

          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
